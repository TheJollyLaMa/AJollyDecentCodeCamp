<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decentralized Media Jukebox</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; max-width: 650px; margin: 30px auto; padding: 20px; }
    h1 { color: #1db954; text-align: center; margin-bottom: 20px; }
    .player-container { background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 20px; text-align: center; }
    video { width: 100%; max-height: 400px; display: block; }
    ul { list-style: none; padding: 0; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
    li { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #222; transition: background 0.2s; display: flex; justify-content: space-between; }
    li:hover { background: #222; }
    li.active { background: #1db954; color: #000; font-weight: bold; }
    .badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: #333; color: #fff; text-transform: uppercase; }
    li.active .badge { background: #000; color: #1db954; }
  </style>
</head>
<body>

  <h1>🎵 Decentralized Media Jukebox</h1>
  
  <div class="player-container">
    <video id="player" controls style="width: 100%;"></video>
  </div>

  <ul id="playlist"><li>Discovering media files in IPFS directory...</li></ul>

  <script>
    const player = document.getElementById('player');
    const playlist = document.getElementById('playlist');
    let mediaFiles = [];
    let currentIndex = 0;

    const mediaRegex = /\.(m4a|mp3|wav|ogg|flac|mp4|webm|mov|m4v)$/i;

    async function loadDirectoryMedia() {
      try {
        let filesFound = [];

        // Method 1: Try gateway IPFS RPC API / API directory resolution
        const urlParts = window.location.pathname.split('/');
        const ipfsIndex = urlParts.indexOf('ipfs');
        const cid = ipfsIndex !== -1 ? urlParts[ipfsIndex + 1] : null;

        if (cid) {
          try {
            const apiUrl = `${window.location.origin}/api/v0/ls?arg=${cid}`;
            const apiRes = await fetch(apiUrl);
            if (apiRes.ok) {
              const data = await apiRes.json();
              if (data.Objects && data.Objects[0] && data.Objects[0].Links) {
                filesFound = data.Objects[0].Links
                  .map(link => link.Name)
                  .filter(name => mediaRegex.test(name));
              }
            }
          } catch (e) {
            console.log('Gateway API endpoint unavailable, trying fallback methods...');
          }
        }

        // Method 2: HTML directory scraping fallback (for gateways that output index HTML)
        if (filesFound.length === 0) {
          const response = await fetch('./');
          const text = await response.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'text/html');
          const links = Array.from(doc.querySelectorAll('a[href]'));

          filesFound = links
            .map(a => a.getAttribute('href'))
            .filter(href => mediaRegex.test(href) && !href.includes('?filename=') && !href.startsWith('http'));
        }

        if (filesFound.length === 0) {
          playlist.innerHTML = '<li>No audio or video files found in directory.</li>';
          return;
        }

        // Standardize file paths into memory array
        mediaFiles = filesFound.map(f => decodeURIComponent(f));

        renderPlaylist();
        loadMedia(0, false);
      } catch (err) {
        console.error('Error reading IPFS directory:', err);
        playlist.innerHTML = '<li>Failed to load media list.</li>';
      }
    }

    function renderPlaylist() {
      playlist.innerHTML = '';
      mediaFiles.forEach((file, index) => {
        const li = document.createElement('li');
        const fileName = file.split('/').pop();
        const ext = fileName.split('.').pop().toLowerCase();
        
        li.innerHTML = `<span>${index + 1}. ${fileName}</span> <span class="badge">${ext}</span>`;
        li.onclick = () => loadMedia(index, true);
        playlist.appendChild(li);
      });
    }

    function loadMedia(index, shouldPlay = true) {
      currentIndex = index;
      player.src = mediaFiles[index];

      Array.from(playlist.children).forEach((li, i) => {
        li.classList.toggle('active', i === index);
      });

      if (shouldPlay) {
        player.play().catch(e => console.log('Autoplay blocked:', e));
      }
    }

    player.addEventListener('ended', () => {
      let nextIndex = currentIndex + 1;
      if (nextIndex < mediaFiles.length) {
        loadMedia(nextIndex, true);
      }
    });

    loadDirectoryMedia();
  </script>
</body>
</html>
